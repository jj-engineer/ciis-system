<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" width="100%" height="100%">
  <defs>
    <!-- Deep Elegant Dark Pink Gradient -->
    <linearGradient id="ciisDarkPinkGradBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d" />
      <stop offset="45%" stop-color="#9d174d" />
      <stop offset="80%" stop-color="#831843" />
      <stop offset="100%" stop-color="#500724" />
    </linearGradient>

    <!-- Outer Rim Accent Gradient -->
    <linearGradient id="rimGradBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>

    <filter id="softGlowBanner" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <path id="textArcTopBanner" d="M 34,64 A 49,49 0 0,1 126,64" fill="none" />
  </defs>

  <!-- Left: Circular CIIS Emblem (Scaled to 160x160 positioned at cx=85, cy=90) -->
  <g transform="translate(10, 10)">
    <!-- Outer Ring -->
    <circle cx="80" cy="80" r="77" fill="none" stroke="url(#rimGradBanner)" stroke-width="2.5" />
    <!-- Main Circular Badge -->
    <circle cx="80" cy="80" r="73" fill="url(#ciisDarkPinkGradBanner)" />
    <!-- Inner White Border -->
    <circle cx="80" cy="80" r="69.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" />

    <!-- Arched Top Khmer Text: សាលារៀន -->
    <text fill="#ffffff" font-family="'Bayon', 'Khmer OS Muol Light', 'Kantumruy Pro', sans-serif" font-size="14" font-weight="bold" letter-spacing="1" filter="url(#softGlowBanner)">
      <textPath href="#textArcTopBanner" startOffset="50%" text-anchor="middle">
        សាលារៀន
      </textPath>
    </text>

    <!-- Center Stylized Graphic (Scale 0.5) -->
    <g transform="translate(80, 77) scale(0.5)" filter="url(#softGlowBanner)">
      <path 
        d="M -76,-10 C -76,-26 -62,-38 -42,-38 C -27,-38 -17,-30 -12,-20 L -26,-14 C -29,-20 -35,-24 -41,-24 C -51,-24 -58,-17 -58,-10 C -58,-3 -51,4 -41,4 C -35,4 -29,0 -26,-6 L -12,0 C -17,10 -27,18 -42,18 C -62,18 -76,6 -76,-10 Z" 
        fill="#ffffff" 
      />
      <path d="M -32,-46 L -22,-46 L -24,-34 L -30,-34 Z" fill="#ffffff" />
      <path d="M -37,-52 C -32,-56 -22,-56 -17,-52" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <path d="M -42,-57 C -34,-63 -20,-63 -12,-57" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" />
      <circle cx="-13" cy="-33" r="7.5" fill="#ffffff" />
      <path d="M -18,-22 C -13,-22 -7,-26 -3,-18 L 10,8 L -3,8 L -11,-10 Z" fill="#ffffff" />
      <path 
        d="M 14,-38 C 38,-40 60,-30 70,-14 C 77,1 67,19 47,23 C 22,27 -20,29 -72,29 C -86,29 -96,25 -92,21 C -72,17 0,17 36,13 C 53,11 56,3 51,-4 C 46,-11 31,-17 16,-17 C 6,-17 -1,-13 -4,-9 L -18,-14 C -13,-27 0,-38 14,-38 Z" 
        fill="#ffffff" 
      />
    </g>

    <!-- Bottom Bold Acronym: CIIS -->
    <text 
      x="80" 
      y="131" 
      text-anchor="middle" 
      fill="#ffffff" 
      font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" 
      font-size="23" 
      font-weight="900" 
      letter-spacing="2.5"
      filter="url(#softGlowBanner)"
    >
      CIIS
    </text>
  </g>

  <!-- Right: Official Typography Branding in 3-Color Palette -->
  <!-- Top Line: Khmer School Name in Solid Black / Dark Pink Accent -->
  <text 
    x="200" 
    y="78" 
    fill="#09090b" 
    font-family="'Moul', 'Bayon', 'Khmer OS Muol', 'Kantumruy Pro', sans-serif" 
    font-size="44" 
    font-weight="bold" 
    letter-spacing="1.5"
  >
    សាលារៀនស៊ី អាយ អាយ អេស (CIIS)
  </text>

  <!-- Bottom Line: English School Name in Rich Dark Gradient Pink -->
  <text 
    x="200" 
    y="136" 
    fill="#831843" 
    font-family="'Inter', 'Impact', 'Outfit', 'Montserrat', 'Arial Black', sans-serif" 
    font-size="30" 
    font-weight="900" 
    letter-spacing="1"
  >
    COMMUNITY INTERNAL INSPIRATION SCHOOL
  </text>
</svg>
