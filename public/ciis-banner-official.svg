<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <defs>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="40%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <path id="badgeArc" d="M 34,70 A 50,50 0 0,1 126,70" fill="none" />
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Circular Emblem -->
  <g transform="translate(20, 20)">
    <!-- Outer rim -->
    <circle cx="80" cy="80" r="78" fill="none" stroke="#f43f5e" stroke-width="4" />
    <circle cx="80" cy="80" r="73" fill="url(#magentaGrad)" />
    <circle cx="80" cy="80" r="69" fill="none" stroke="#ffffff" stroke-width="2" />

    <!-- Arched Text: សាលារៀន -->
    <text fill="#ffffff" font-family="'Bayon', 'Kantumruy Pro', sans-serif" font-size="15" font-weight="bold" letter-spacing="1">
      <textPath href="#badgeArc" startOffset="50%" text-anchor="middle">សាលារៀន</textPath>
    </text>

    <!-- Center Stylized CIIS Figure -->
    <g transform="translate(80, 78) scale(0.52)">
      <path d="M -76,-10 C -76,-26 -62,-38 -42,-38 C -27,-38 -17,-30 -12,-20 L -26,-14 C -29,-20 -35,-24 -41,-24 C -51,-24 -58,-17 -58,-10 C -58,-3 -51,4 -41,4 C -35,4 -29,0 -26,-6 L -12,0 C -17,10 -27,18 -42,18 C -62,18 -76,6 -76,-10 Z" fill="#ffffff" />
      <path d="M -32,-46 L -22,-46 L -24,-34 L -30,-34 Z" fill="#ffffff" />
      <path d="M -37,-52 C -32,-56 -22,-56 -17,-52" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M -42,-57 C -34,-63 -20,-63 -12,-57" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round" />
      <circle cx="-13" cy="-33" r="8" fill="#ffffff" />
      <path d="M -18,-22 C -13,-22 -7,-26 -3,-18 L 10,8 L -3,8 L -11,-10 Z" fill="#ffffff" />
      <path d="M 14,-38 C 38,-40 60,-30 70,-14 C 77,1 67,19 47,23 C 22,27 -20,29 -72,29 C -86,29 -96,25 -92,21 C -72,17 0,17 36,13 C 53,11 56,3 51,-4 C 46,-11 31,-17 16,-17 C 6,-17 -1,-13 -4,-9 L -18,-14 C -13,-27 0,-38 14,-38 Z" fill="#ffffff" />
    </g>

    <!-- Bottom Text: CIIS -->
    <text x="80" y="132" text-anchor="middle" fill="#ffffff" font-family="'Inter', 'Montserrat', sans-serif" font-size="24" font-weight="900" letter-spacing="2">CIIS</text>
  </g>

  <!-- Right Side Typography -->
  <!-- Top Line: Cyan/Sky-Blue Khmer Script Title -->
  <text x="210" y="85" fill="url(#skyGrad)" font-family="'Bayon', 'Khmer OS Muol', 'Kantumruy Pro', sans-serif" font-size="46" font-weight="bold" letter-spacing="1.5" filter="url(#shadow)">
    សាលារៀនស៊ី អាយ អាយ អេស
  </text>

  <!-- Bottom Line: Vibrant Magenta English Sub-Text -->
  <text x="210" y="145" fill="url(#magentaGrad)" font-family="'Impact', 'Arial Black', 'Inter', sans-serif" font-size="32" font-weight="900" letter-spacing="1" filter="url(#shadow)">
    COMMUNITY INTERNAL INSPIRATION SCHOOL
  </text>
</svg>
